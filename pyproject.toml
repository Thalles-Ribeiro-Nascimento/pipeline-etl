[project]
name = "etl-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Thalles-Ribeiro-Nascimento",email = "thalles.nascimentorj@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=1.4.0,<3.0.0)",
    "pyarrow (>=10.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "streamlit (>=1.35.0,<2.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "plotly (>=6.6.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "etl_project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
